[project]
name = "dices-ai"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.135.1",
    "pydantic-settings>=2.13.1",
    "pytest>=9.0.2",
    "uvicorn>=0.42.0",
]

[dependency-groups]
dev = [
    "pre-commit>=4.2.0",
    "ruff>=0.15.6",
    "ty>=0.0.23",
]

[tool.uv]
default-groups = ['dev']

[tool.ruff]
# Line length configuration
line-length = 120

# Target Python version
target-version = "py313"

src = ["src"]

[tool.ruff.lint]
# Enable all rules by default, then explicitly disable specific ones
select = ["ALL"]

ignore = [
    # Missing docstrings
    "D100",  # Missing docstring in public module
    "D101",  # Missing docstring in public class
    "D102",  # Missing docstring in public method
    "D103",  # Missing docstring in public function
    "D104",  # Missing docstring in public package
    "D105",  # Missing docstring in magic method
    "D106",  # Missing docstring in public nested class
    "D107",  # Missing docstring in __init__
    # Docstring formatting
    "D200",  # One-line docstring should fit on one line
    "D203",  # One blank line before class docstring
    "D212",  # Multi-line docstring summary should start at the first line
    "D401",  # First line of docstring should be in imperative mood
    # Type annotations
    "ANN201",  # Missing return type annotation for public function
    # Code quality
    "COM812",  # Missing trailing comma in Python 3.6+
    "ERA001",  # Found commented-out code
    "FBT",     # Boolean trap - using boolean as positional argument
    "INP001",  # File is part of an implicit namespace package. Add an __init__.py
    "ISC001",  # Conflicts with formatter
    "T201",    # `print` found
]

# Allow autofix for all enabled rules (when `--fix`) is provided
fixable = ["ALL"]
unfixable = []

# Allow unused variables when underscore-prefixed.
dummy-variable-rgx = "^(_+|(_+[a-zA-Z0-9_]*[a-zA-Z0-9]+?))$"

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401", "E402"]  # Ignore unused imports and imports not at top

[tool.ruff.lint.mccabe]
max-complexity = 10

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.flake8-quotes]
docstring-quotes = "double"
inline-quotes = "double"

[tool.ruff.lint.flake8-tidy-imports]
ban-relative-imports = "all"

[tool.ty.environment]
root = ["./src"]

[tool.ty.src]
include = ["src"]

[tool.ruff.lint.pyupgrade]
keep-runtime-typing = true
[tool.ruff.lint.pylint]
max-args = 8
max-returns = 5

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = "--cov=pikadantic --cov-fail-under=90"
